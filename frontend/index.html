<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/riskwise-icon.svg" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Set the saved theme before first paint so there's no flash of the wrong mode.
      (function () {
        try {
          document.documentElement.setAttribute("data-theme", localStorage.getItem("rw_theme") || "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>RiskWise — Know your risk. Own your edge.</title>
    <meta
      name="description"
      content="RiskWise — allocation, hedging and portfolio analytics for Indian retail traders, in one cockpit. Educational analytics, not investment advice."
    />
    <meta property="og:title" content="RiskWise" />
    <meta property="og:description" content="Know your risk. Own your edge. Allocation, hedging and analytics — in one cockpit." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
